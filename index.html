<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:widget="http://www.netvibes.com/ns/">
    <head>
        <title>Misc Product List</title>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="apiVersion" content="1.0" />
        <meta name="debugMode" content="true" />
        <meta name="strictMode" content="false" />
        <meta name="author" content="3DX Widget" />
        <meta name="description" content="Lists Physical Products from the Misc bookmark." />
        <link rel="stylesheet" type="text/css" href="styles/widget.css" />
        <script type="text/javascript" src="scripts/main.js"></script>
        <widget:preferences>
            <widget:preference type="text" name="SecurityContext" label="Security Context (Role.Organization.CollabSpace)" defaultValue="" />
            <widget:preference type="text" name="Tenant" label="3DSpace Tenant (required on cloud)" defaultValue="" />
        </widget:preferences>
        <script type="text/javascript">
            (function waitForWidget() {
                if (typeof widget === "undefined" || !widget.addEvent) {
                    window.setTimeout(waitForWidget, 100);
                    return;
                }

                widget.addEvent("onLoad", function () {
                    var root = widget.body;
                    var finished = false;
                    var moduleTimer;

                    window.initializeLidsTestButton(root);
                    window.reportLidsWidgetStatus(root, "Dashboard onLoad received. Loading platform modules...");
                    moduleTimer = window.setTimeout(function () {
                        if (!finished) {
                            finished = true;
                            window.reportLidsWidgetStatus(root, "Timed out while loading the 3DEXPERIENCE widget modules.", "error");
                        }
                    }, 30000);

                    try {
                        var widgetAssetBaseUrl = "https://bertolius-me.github.io/3dx-widget/";
                        var jsPdfUrl = new URL("scripts/vendor/jspdf.umd.min.js", widgetAssetBaseUrl).href;
                        var autoTableUrl = new URL("scripts/vendor/jspdf.plugin.autotable.min.js", widgetAssetBaseUrl).href;
                        require([
                            "DS/WAFData/WAFData",
                            "DS/i3DXCompassServices/i3DXCompassServices",
                            jsPdfUrl,
                            autoTableUrl
                        ], function (WAFData, i3DXCompassServices, jsPdfModule, autoTableModule) {
                            if (finished) {
                                return;
                            }
                            finished = true;
                            window.clearTimeout(moduleTimer);
                            window.reportLidsWidgetStatus(root, "Platform modules loaded. Initializing the widget...");

                            try {
                                window.initializeLidsWidget(
                                    WAFData,
                                    i3DXCompassServices,
                                    widget.getValue("x3dPlatformId"),
                                    widget.getValue("SecurityContext"),
                                    widget.getValue("Tenant"),
                                    root,
                                    jsPdfModule,
                                    autoTableModule
                                );
                            } catch (error) {
                                window.reportLidsWidgetStatus(root, "Widget initialization failed: " + (error.message || error), "error");
                            }
                        }, function (error) {
                            if (finished) {
                                return;
                            }
                            finished = true;
                            window.clearTimeout(moduleTimer);
                            window.reportLidsWidgetStatus(root, "Could not load required widget modules: " + (error.message || error), "error");
                        });
                    } catch (error) {
                        if (!finished) {
                            finished = true;
                            window.clearTimeout(moduleTimer);
                            window.reportLidsWidgetStatus(root, "Module loader failed: " + (error.message || error), "error");
                        }
                    }
                });
            }());
        </script>
    </head>
    <body>
        <main class="widget" aria-label="Misc Physical Products">
            <header class="widget-header">
                <div>
                    <p class="eyebrow">BOOKMARK</p>
                    <h1 class="widget-title">Misc</h1>
                </div>
                <div class="widget-actions">
                    <button class="test-number-button" type="button">Generate test number</button>
                    <button class="export-pdf" type="button" disabled="disabled">
                        <span class="button-icon" aria-hidden="true">&#8681;</span>
                        <span>Export PDF</span>
                    </button>
                    <button class="load-products" type="button">
                        <span class="button-icon" aria-hidden="true">&#8635;</span>
                        <span>Load products</span>
                    </button>
                </div>
            </header>
            <section class="number-test" aria-label="Random number button test">
                <span class="number-test-label">TEST NUMBER</span>
                <output class="test-number-output" aria-live="polite">No number generated</output>
            </section>
            <p class="status" role="status" aria-live="polite">Waiting for dashboard initialization...</p>
            <ol class="debug-log" aria-label="Widget progress log" aria-live="polite">
                <li class="debug-entry">Waiting for the dashboard onLoad event.</li>
            </ol>
            <ul class="products" aria-label="Physical Products in Misc"></ul>
        </main>
    </body>
</html>
